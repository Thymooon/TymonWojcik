        body {
          font-family: "Helvetica", monospace;
          background-color: #ffffff;
          color: #000000;
          margin: 0;
          padding: 20px 15px;
          box-sizing: border-box;
          
          /* Wyśrodkowanie całej zawartości w pionie i poziomie */
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        }

        /* Główny kontener trzymający stałą szerokość całej strony */
        .container {
          width: 100%;
          max-width: 320px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        /* Górny nagłówek wyśrodkowany */
        .top-header {
          width: 100%;
          text-align: right; /* Scentralizowany napis Tymon Wójcik */
          font-size: 26px;
          margin-bottom: 8px;
        }

        /* Tytuł pracy wyśrodkowany */
        .work-title {
          width: 100%;
          text-align: right; /* Scentralizowany tytuł */
          font-style: italic;
          font-size: 13px;
          margin-bottom: 25px;
          line-height: 1.2;
          min-height: 28px;
        }

        /* Sekcja środkowa (menu + obrazek) */
        .main-content {
          display: flex;
          flex-direction: row;
          gap: 12px;
          align-items: flex-start;
          justify-content: center;
        }

        /* Boczne słowa (dm me if...) */
        .side-menu {
          display: flex;
          flex-direction: column;
          gap: 16px;
          font-style: italic;
          font-size: 14px;
          padding-top: 30px;
          flex-shrink: 0;
        }

        /* Ramka kadrująca ASCII */
        .stage {
          position: relative;
          width: 275px;
          height: 375px;
          overflow: hidden;
          background-color: #ffffff;
        }

        /* Warstwa ASCII */
        #ascii-bg {
          position: absolute;
          top: 0;
          left: 0;
          z-index: 1;
          font-size: 5px;
          line-height: 5px;
          margin: 0;
          white-space: pre;
          user-select: none;
          pointer-events: none;
        }

        /* Obrazek w centrum ramki */
        .img-revealer {
          position: absolute;
          top: 0;
          left: 0;
          z-index: 2;
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        #view {
          max-width: 78%;
          max-height: 80%;
          object-fit: contain;
          display: block;
        }

        /* Przycisk nawigacji w dolnej części kadru */
        .controls {
          position: absolute;
          bottom: 10px;
          left: 0;
          width: 100%;
          z-index: 10;
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 15px;
          font-size: 13px;
          background-color: rgba(255, 255, 255, 0.75);
          padding: 4px 0;
        }

        .btn {
          cursor: pointer;
          color: #0000ff;
          text-decoration: underline;
        }

        .btn:hover {
          color: #ff0000;
        }

        /* Scentralizowany dolny pasek z informacjami */
        .footer-info {
          width: 100%;
          display: flex;
          justify-content: space-between;
          font-size: 11px;
          margin-top: 25px;
          border-top: 1px dashed #cccccc;
          padding-top: 10px;
          text-align: center;
        }

        techniqueEl.innerText = asciiArt[index].technique || "";
        yearEl.innerText = asciiArt[index].year || "";
        priceEl.innerText = asciiArt[index].price || "";
      }

      document.getElementById("counter").innerText = (index + 1) + " / " + images.length;
    }

    function changeSlide(direction) {
      index += direction;
      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;
