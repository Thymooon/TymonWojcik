<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tymon Wójcik — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <!-- Ekran A: Galeria -->
    <div id="gallery-screen" class="screen active">
      <header class="header">
        <button id="header-menu" class="font-bold" aria-label="menu">menu</button>
        <span class="brand font-bold">Tymon Wójcik</span>
        <button id="header-lang" class="font-bold" aria-label="zmień język">en</button>
      </header>

      <div class="gallery-content">
        <div class="artwork-container">
          <img id="artwork-img" class="artwork-image" alt="Praca malarska">
        </div>

        <div class="about-link-container">
          <button id="about-link" class="about-link">o pracy</button>
        </div>

        <nav class="navigator" aria-label="Nawigacja po pracach">
          <button id="prev-btn" class="nav-btn" aria-label="poprzedni slajd">
            <img src="img/heading/pl/nawigator.svg" alt="">
          </button>
          <span id="counter" class="counter" aria-live="polite">[1/2]</span>
          <button id="next-btn" class="nav-btn next" aria-label="następny slajd">
            <img src="img/heading/pl/nawigator.svg" alt="">
          </button>
        </nav>
      </div>
    </div>

    <!-- Ekran B: O pracy -->
    <div id="about-screen" class="screen about-screen">
      <div class="about-top-bar">
        <button id="about-back-btn" class="back-arrow" aria-label="wstecz">
          <img src="img/heading/pl/strzalka.svg" alt="wstecz">
        </button>
      </div>

      <div id="about-title-block" class="about-title-block"></div>
      <div id="about-technique" class="about-technique"></div>
      <div id="about-description" class="about-description"></div>

      <div class="about-footer">
        <span id="about-dim"></span>
        <span id="about-year"></span>
      </div>
    </div>

    <!-- Ekran C: Menu -->
    <div id="menu-screen" class="screen menu-screen">
      <div class="menu-top-bar">
        <button id="menu-back-btn" class="back-arrow" aria-label="wstecz">
          <img src="img/heading/pl/strzalka.svg" alt="wstecz">
        </button>
      </div>
      <div class="menu-links-container">
        <button id="menu-inne-prace" class="menu-item-btn" aria-label="Inne prace">
          <img id="menu-img-inne-prace" data-svg="inne-prace.svg" data-alt-pl="Inne prace" data-alt-en="Inne prace" src="img/heading/pl/inne-prace.svg" alt="Inne prace">
        </button>
        <button id="menu-o-mnie" class="menu-item-btn" aria-label="O mnie / bio">
          <img id="menu-img-o-mnie-bio" data-svg="o-mnie-bio.svg" data-alt-pl="O mnie / bio" data-alt-en="About me / bio" src="img/heading/pl/o-mnie-bio.svg" alt="O mnie / bio">
        </button>
        <button id="menu-kontakt" class="menu-item-btn" aria-label="Kontakt">
          <img id="menu-img-kontakt" data-svg="kontakt.svg" data-alt-pl="Kontakt" data-alt-en="Contact" src="img/heading/pl/kontakt.svg" alt="Kontakt">
        </button>
      </div>
    </div>

    <!-- Ekran D: Inne prace -->
    <div id="other-gallery-screen" class="screen other-gallery-screen">
      <header class="header">
        <button id="other-back-btn" class="back-arrow" aria-label="wstecz">
          <img src="img/heading/pl/strzalka.svg" alt="wstecz">
        </button>
        <span class="brand font-bold">Tymon Wójcik</span>
        <span style="width: 24px;"></span>
      </header>

      <div class="gallery-content">
        <div class="artwork-container">
          <img id="other-artwork-img" class="artwork-image" alt="Inna praca malarska">
        </div>

        <div class="about-link-container">
          <button id="other-about-link" class="about-link">o pracy</button>
        </div>

        <nav class="navigator" aria-label="Nawigacja po innych pracach">
          <button id="other-prev-btn" class="nav-btn" aria-label="poprzedni slajd">
            <img src="img/heading/pl/nawigator.svg" alt="">
          </button>
          <span id="other-counter" class="counter" aria-live="polite">[1/1]</span>
          <button id="other-next-btn" class="nav-btn next" aria-label="następny slajd">
            <img src="img/heading/pl/nawigator.svg" alt="">
          </button>
        </nav>
      </div>
    </div>

    <!-- Ekran E: O mnie / bio -->
    <div id="bio-screen" class="screen bio-screen">
      <div class="about-top-bar">
        <button id="bio-back-btn" class="back-arrow" aria-label="wstecz">
          <img src="img/heading/pl/strzalka.svg" alt="wstecz">
        </button>
      </div>
      <div id="bio-text" class="bio-text"></div>
    </div>

    <!-- Ekran F: Kontakt -->
    <div id="contact-screen" class="screen contact-screen">
      <div class="contact-top-bar">
        <button id="contact-back-btn" class="back-arrow" aria-label="wstecz">
          <img src="img/heading/pl/strzalka.svg" alt="wstecz">
        </button>
      </div>
      <div class="contact-content">
        <a id="contact-email" class="contact-link font-bold" href="mailto:tymekw@icloud.com">tymekw@icloud.com</a>
        <a id="contact-phone" class="contact-link font-bold" href="tel:737826710">737 826 710</a>
        <a id="contact-insta" class="contact-link font-bold" href="https://instagram.com/tymekwojcik_">@tymekwojcik_</a>
      </div>
    </div>


  </div>

  <script src="data/works.js"></script>
  <script src="app.js"></script>
</body>
</html>
