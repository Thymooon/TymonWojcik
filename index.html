    .info-title {

    }
      #info-name {
        font-style: italic; /* Ten styl zadziała TYLKO i wyłącznie na element o id="info-tytul" */
      }

    .main-content {
      display: flex;
      gap: 10px;            /* Odstęp między tekstem a stage */
      margin-top: 0px;        /* Odstęp od górnego paska z imieniem */
      align-items: flex-start; /* Wyrównanie góry tekstu do góry zdjęcia */
      width: 100%;
    }

    .left-title {
      font-size: 24px;
      flex-shrink: 0;          /* Blokuje kurczenie się tekstu przez flexbox */
      width: 70px;            /* Stała szerokość kolumny z tekstem */
      line-height: 78px;        /* Przyjemna dla oka odległość między liniami */
      margin-top: 0px;
      margin-left: 20px;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 1000px;
      overflow: visible; /* DODANO: Pozwala obrazkowi wyjść poza kontener, gdy dasz duży margin-left */
    }

    /* Warstwa 1: Tekst ASCII w tle z płynnym przejściem koloru */
    #ascii-bg {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      font-size: 5.1px;
      line-height: 5px;
      margin: 0;
      white-space: pre;
      user-select: none;
      transition: color 0.5s ease; /* opcjonalne płynne przejście koloru */
      margin-left: 0px;
      margin-top: -20px;
      pointer-events: none; /* Kursor i kliknięcia ignorują tę warstwę */
    }

    /* Warstwa 2: Przesuwający się kontener maskujący */
    .img-revealer {
      position: relative;
      z-index: 2;
      width: 100%;
      overflow: hidden;
      clip-path: polygon(0 0, 0 0, 0 100%, 0 100%);
    }

    .img-revealer.loaded {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      transition: clip-path 0.05s linear;
    }

    #view {
      display: block;
      width: auto;
      max-width: 100%;
      max-height: 550px;
      transform: translateX(-100%);
      transition: none;
    }

    .img-revealer.loaded #view {
      transform: translateX(0);
      transition: transform 0.05s linear;
    }

    /* Nawigacja */
    .controls {
      margin-top: 25px;
      font-size: 14px;
      position: relative;
      z-index: 10; /* Zabezpieczenie przed przykryciem przez warstwy wyżej */
      margin-left: 510px;
    }

    .btn {
      cursor: pointer;
      color: #0000ff;
      text-decoration: underline;
      margin-right: 15px;
    }

    .btn:hover {
      color: #ff0000;
    }

    #counter {
      margin-right: 15px;
    }
  </style>

    let index = 0;

    function loadSlide() {
      const revealer = document.getElementById("revealer");
      const img = document.getElementById("view");
      const ascii = document.getElementById("ascii-bg");
      const nameEl = document.getElementById("info-name");
      const dimensionsEl = document.getElementById("info-dimensions");
      const techniqueEl = document.getElementById("info-technique");
      const yearEl = document.getElementById("info-year");
      const priceEl = document.getElementById("info-price");
      
      revealer.style.transition = "none";
      revealer.classList.remove("loaded");
      img.src = images[index];

      // Bezpieczne przypisanie parametrów z obiektu
      if (asciiArt[index]) {
        ascii.innerText = asciiArt[index].text;
        ascii.style.color = asciiArt[index].color || "#000000";
        
        // Aplikujemy margines bezpośrednio na kontener ze zdjęciem (.img-revealer)
        revealer.style.marginLeft = asciiArt[index].stageMarginLeft || "0px";
        revealer.style.marginTop = asciiArt[index].stageMarginTop || "0px";
        nameEl.innerText = asciiArt[index].name || "kupka Tymka";
        dimensionsEl.innerText = asciiArt[index].dimensions || "ego x 15.24 cm";
        techniqueEl.innerText = asciiArt[index].technique || "siku Tymka";
        yearEl.innerText = asciiArt[index].year || "XII wiek";
        priceEl.innerText = asciiArt[index].price || "sold";
        
      }

      document.getElementById("counter").innerText = (index + 1) + " / " + images.length;

      setTimeout(() => {
        revealer.classList.add("loaded");
      }, 50);
    }

    // NAPRAWIONO: Przywrócono usuniętą wcześniej funkcję nawigacji
    function changeSlide(direction) {
      index += direction;
      if (index < 0) index = images.length - 1;
      if (index >= images.length) index = 0;
      loadSlide();
    }
